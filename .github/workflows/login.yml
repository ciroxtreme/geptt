name: ChatGPT Login Challenge & Relay (Camoufox Stealth & Cloudflare WARP)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      email:
        description: "Email target untuk login"
        required: true
        default: "tuanciroxtreme@gmail.com"
      prompt:
        description: "Pertanyaan opsional untuk ChatGPT"
        required: false
        default: ""

jobs:
  run-challenge:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install & Setup Official Cloudflare WARP SOCKS5 Tunnel
        run: |
          echo "📥 Memasang Cloudflare WARP client resmi (ubuntu-22.04 jammy)..."
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb curl gpg cloudflare-warp

          sudo systemctl start warp-svc
          sleep 2

          warp-cli --accept-tos registration new || warp-cli --accept-tos register || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true

          sleep 3
          echo "✅ Status WARP:"
          warp-cli --accept-tos status || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Pre-Cached Camoufox Browser from xtt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "📥 Menarik binary Camoufox browser dari runner repo ciroxtreme/xtt..."
          mkdir -p ~/.cache/camoufox
          # Tarik cache dari GitHub API via gh
          CACHE_URL=$(gh api /repos/ciroxtreme/xtt/actions/caches -q '.actions_caches[] | select(.key=="Linux-camoufox-browser-v1") | .id' 2>/dev/null || true)
          echo "Cache ID: $CACHE_URL"

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Fast Setup Python Dependencies
        run: |
          pip install "camoufox[geoip]" requests
          if [ ! -d ~/.cache/camoufox ] || [ -z "$(ls -A ~/.cache/camoufox 2>/dev/null)" ]; then
            camoufox fetch || true
          fi

      - name: Run Login & Relay Engine with Camoufox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_EMAIL: ${{ github.event.inputs.email || 'tuanciroxtreme@gmail.com' }}
          PROMPT_ASK: ${{ github.event.inputs.prompt || '' }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -u login_challenge.py "${{ github.event.inputs.prompt || '' }}"

      - name: Commit Updated Session If Changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          if [ -f session_chatgpt.json ]; then
            git add session_chatgpt.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto-persist session_chatgpt.json [skip ci]"
              git push origin main
            else
              echo "No session changes to commit."
            fi
          fi
